<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>کوردیە | بازاڕی بەرهەمە کوردییەکان</title>

  <style>

    /* =====================================================
       KURDIA COLOR SYSTEM
       Main Accent: Amber #FFBF00
    ====================================================== */

    :root {
      --amber: #FFBF00;
      --amber-dark: #D99F00;
      --amber-light: #FFD34D;

      --black: #111111;
      --black-soft: #1A1A1A;
      --dark-card: #202020;

      --cream: #F7F4ED;
      --white: #FFFFFF;

      --text: #171717;
      --muted: #777777;
      --border: #E8E8E8;
    }


    /* =====================================================
       RESET
    ====================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: var(--cream);
      color: var(--text);
      line-height: 1.7;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }


    /* =====================================================
       HEADER
    ====================================================== */

    header {
      background: var(--black);
      color: var(--white);

      position: sticky;
      top: 0;
      z-index: 1000;

      box-shadow: 0 4px 25px rgba(0,0,0,.20);
    }

    .navbar {
      max-width: 1250px;
      height: 90px;

      margin: auto;
      padding: 0 25px;

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
    }

    .brand-name {
      justify-self: start;

      font-size: 29px;
      font-weight: 900;

      color: var(--amber);

      letter-spacing: -.5px;
    }

    .center-logo {
      justify-self: center;

      width: 64px;
      height: 64px;

      border-radius: 50%;

      overflow: hidden;

      background: var(--white);

      border: 2px solid var(--amber);

      box-shadow:
        0 0 0 4px rgba(255,191,0,.08),
        0 0 25px rgba(255,191,0,.22);
    }

    .center-logo img {
      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    .nav-actions {
      justify-self: end;

      display: flex;
      gap: 10px;
    }

    .nav-btn {
      background: var(--black-soft);
      color: var(--white);

      border: 1px solid #333;

      padding: 10px 16px;

      border-radius: 10px;

      font-weight: 700;

      transition: .2s ease;
    }

    .nav-btn:hover {
      background: var(--amber);
      color: var(--black);
      border-color: var(--amber);
    }


    /* =====================================================
       HERO
    ====================================================== */

    .hero {
      min-height: 510px;

      background:
        radial-gradient(
          circle at center,
          rgba(255,191,0,.18),
          transparent 40%
        ),
        linear-gradient(
          rgba(0,0,0,.82),
          rgba(0,0,0,.92)
        );

      color: var(--white);

      display: flex;
      align-items: center;

      text-align: center;

      padding: 70px 20px;
    }

    .hero-content {
      max-width: 900px;
      margin: auto;
    }

    .hero h1 {
      font-size: clamp(45px, 7vw, 82px);

      color: var(--amber);

      font-weight: 900;

      margin-bottom: 12px;

      text-shadow:
        0 0 25px rgba(255,191,0,.16);
    }

    .hero h2 {
      font-size: clamp(25px, 4vw, 43px);

      margin-bottom: 15px;

      color: var(--white);
    }

    .hero p {
      color: #D5D5D5;

      font-size: 19px;

      max-width: 700px;

      margin: 0 auto 30px;
    }

    .hero-buttons {
      display: flex;

      justify-content: center;

      gap: 12px;

      flex-wrap: wrap;
    }

    .primary-btn {
      background: var(--amber);

      color: var(--black);

      border: 1px solid var(--amber);

      padding: 14px 25px;

      border-radius: 12px;

      font-weight: 900;

      font-size: 16px;

      transition: .2s ease;
